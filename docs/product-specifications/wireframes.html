<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplyd Academy · Offline wireframes</title>
<style>
:root{--ink:#19252d;--muted:#53636c;--line:#b8c2c7;--wash:#f1f4f5;--accent:#264e62;--paper:#fff;--good:#245f3a;--warn:#754617}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--wash)}a{color:#174760;text-underline-offset:3px}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--accent);color:white;border:1px solid var(--accent);border-radius:4px;padding:10px 16px;min-height:44px}button.secondary{background:#fff;color:var(--accent)}button:disabled{background:#e3e7e9;color:#5a6368;border-color:#aab2b7;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid #d05b00;outline-offset:3px}input,select,textarea{width:100%;border:1px solid #74868f;background:#fff;border-radius:3px;padding:10px;min-height:44px}textarea{min-height:110px;resize:vertical}label{display:block;font-weight:600;margin:14px 0 6px}input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle;margin-right:8px}label.check{font-weight:400;display:flex;align-items:start;gap:6px}.check input{flex:none;margin-top:4px}header{background:white;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-size:22px;font-weight:750}header .context{margin-left:auto;max-width:300px}.banner{background:#e6edf0;border-bottom:1px solid var(--line);padding:10px 24px;font-size:14px}.layout{display:grid;grid-template-columns:245px 1fr;max-width:1500px;margin:auto}nav{padding:20px 16px;border-right:1px solid var(--line)}nav a{display:block;padding:9px 10px;text-decoration:none;border-radius:4px;font-size:14px;margin:2px 0}nav a[aria-current=page]{background:#dce7ec;font-weight:700;border-left:4px solid var(--accent)}nav small{display:block;color:var(--muted);margin:16px 10px 4px;font-weight:700}main{padding:28px 36px;min-width:0}h1{margin:4px 0 8px;font-size:30px;line-height:1.2}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 14px}.eyebrow{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:6px;padding:22px;margin:0 0 18px}.grid .card{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}.tag{display:inline-block;font-size:13px;border:1px solid #859ba5;border-radius:20px;padding:3px 10px;margin:0 4px 8px 0;background:#f5f8f9}.notice{border-left:4px solid var(--accent);background:#e9f0f3;padding:12px 15px;margin:14px 0}.warning{border-color:var(--warn);background:#fbf0e3}.success{border-color:var(--good);background:#eaf4ed}.error{color:#9c2525;font-weight:600;margin:8px 0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.steps span{border:1px solid var(--line);padding:6px 10px;font-size:14px;background:white}.list{list-style:none;padding:0;margin:0}.list li{padding:12px 0;border-bottom:1px solid #d4dce0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px;vertical-align:top}th{background:#eef3f5}progress{width:100%;height:16px;accent-color:var(--accent)}.preview{padding:22px;border:2px dashed #8c9ca4;background:#f7f9fa;text-align:center;margin:14px 0}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;background:#fff;padding:10px;z-index:10}#toast{position:fixed;bottom:20px;right:20px;max-width:480px;padding:15px 20px;background:#192f3a;color:#fff;border-radius:6px;box-shadow:0 3px 15px #0003;display:none;z-index:20}.foot{font-size:12px;color:var(--muted);margin-top:30px}details{margin:12px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;font-weight:600}.inline{display:flex;gap:10px;align-items:center}.inline>input{flex:1}.inline>button{flex:none}.stat{font-size:28px;font-weight:700}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}fieldset{border:1px solid var(--line);padding:15px;margin:16px 0}legend{font-weight:700}.screen-id{float:right;color:var(--muted);font-size:13px}.label-note{font-size:13px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:4px;padding:10px}nav a{white-space:nowrap;flex:none}nav small{display:none}main{padding:22px 16px}.grid,.grid.three,.form-row{grid-template-columns:1fr}header{padding:16px}header .context{margin:0;max-width:none;width:100%}.banner{padding:10px 16px}h1{font-size:26px}#toast{left:16px;right:16px;bottom:16px;max-width:none}.screen-id{float:none;display:block}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><div class="brand">Aplyd Academy</div><span class="tag">Design prototype · v0.1</span><div class="context"><label for="context" style="margin:0;font-size:13px">Learning context</label><select id="context"><option value="Agri Saha">Agri Saha · Farmer</option><option value="MSME">MSME · Owner</option><option value="Government">Government · Administrator</option><option value="Health Saha">Health Saha · Community worker</option><option value="Academy">Direct Academy · Professional</option></select></div></header>
<div class="banner">Offline simulation. Fictional data. Changes stay in this browser; no accounts, assessments, payments, messages or external integrations are created. Staff screens are review views, not real permission grants.</div>
<div class="layout"><nav aria-label="Prototype screens" id="nav"></nav><main id="main" tabindex="-1"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='aplyd-academy-wireframe-v01';
const defaults={context:'Agri Saha',name:'Asha',roles:'Farmer',adult:false,onboarded:false,enrolled:false,activity:false,attempt:'draft',score:84,critical:true,decision:'',feedback:'',appeal:'',credential:false,public:false,sharing:false,evidence:{},posts:[],profileSaved:false,mentor:false,savedUpdate:false};
let state={...defaults,evidence:{},posts:[]};try{const stored=JSON.parse(localStorage.getItem(KEY)||'null');if(stored&&typeof stored==='object')state={...state,...stored};}catch(e){}
const screens=[['01','Onboarding'],['02','Home'],['03','Catalog'],['04','Pathway details'],['05','Learning'],['06','Assessment'],['07','Feedback and appeal'],['08','Credential'],['09','Community'],['10','Assessor queue'],['11','Admin workspace'],['12','Integration and sharing'],['13','Mentor directory · R2'],['14','Continuous learning']];
const main=document.getElementById('main');let toastTimer;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){notify('Browser storage unavailable. Changes last only in this open page.');}}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',6000);}
function go(id){if(location.hash==='#WF-'+id)render();else location.hash='WF-'+id;}
function button(label,id,secondary=false){return `<button ${secondary?'class="secondary"':''} data-go="${id}">${label}</button>`;}
function heading(id,title,sub){return `<span class="screen-id">WF-${id}</span><div class="eyebrow">${esc(['05','06','07','08','10'].includes(id)?state.enrollmentContext||state.context:state.context)} · ${id==='10'||id==='11'?'Staff review view':'Learner experience'}</div><h1>${title}</h1><p class="muted">${sub}</p>`;}
function pathway(context=state.enrollmentContext||state.context){return context==='Agri Saha'?'AI for farm records and expert questions':context==='MSME'?'AI for customer communication and business records':context==='Government'?'AI for administrative drafting and verified summaries':context==='Health Saha'?'AI for role-appropriate health communication':'AI for clear documents and everyday productivity';}
function sharing(){return Boolean(state.shareByContext&&state.shareByContext[state.context]);}
function status(){return state.credential?'Competency demonstrated':state.attempt==='passed'?'Passed · award ready':state.attempt==='failed'?'Needs improvement':state.attempt==='submitted'||state.attempt==='under_review'?'Awaiting human review':state.activity?'Assessment ready':state.enrolled?'Learning in progress':'Not enrolled';}
function error(id,msg){document.getElementById(id).textContent=msg;document.getElementById(id).focus();}
const views={
'01':()=>heading('01','Let’s make learning relevant','Choose how you learn and what you want to do better.')+`<div class="grid"><form id="onboarding" class="card"><h2>Your learning profile</h2><label for="name">Display name</label><input id="name" name="name" value="${esc(state.name)}" maxlength="100" required><div class="form-row"><div><label for="language">Language</label><select id="language"><option>English · demonstration</option></select></div><div><label for="goal">Learning goal</label><select id="goal"><option>Do my work better with AI</option><option>Build foundational digital skills</option><option>Explore learning options</option></select></div></div><label for="roles">Work roles</label><input id="roles" value="${esc(state.roles)}" placeholder="Farmer, MSME owner" maxlength="100"><p class="label-note">Multiple roles are allowed. Role tags change relevance, not permissions.</p><label class="check"><input type="checkbox" id="adult" ${state.adult?'checked':''}>I confirm I am an adult learner for this pilot.</label><p class="label-note">Terms and identity verification are represented here; no actual registration occurs.</p><p id="onboarding-error" class="error" tabindex="-1" role="alert"></p><button type="submit">Save profile and continue</button></form><section class="card"><h2>One Academy, relevant pathways</h2><p>Learn practical work skills, use AI productively, and know what to verify.</p><ul><li>Short activities and real practice</li><li>Peer and facilitator support</li><li>Assessments that check judgment</li><li>Credentials that explain what you demonstrated</li></ul><div class="notice">Partner sign-in and account recovery are specifications only in this prototype.</div>${button('Explore the catalog','03',true)}</section></div>`,
'02':()=>heading('02',`Welcome, ${esc(state.name)}`,'Build skills you can use in your work today.')+`<div class="grid three"><section class="card"><div class="eyebrow">Your pathway</div><h2>${esc(pathway())}</h2><span class="tag">${status()}</span>${state.enrolled?`<p class="label-note">Record from ${esc(state.enrollmentContext||state.context)}</p>`:''}<progress max="3" value="${state.credential?3:state.activity?2:state.enrolled?1:0}" aria-label="Illustrative pathway progress"></progress><p class="label-note">Enrollment → practice → assessed achievement</p>${button(state.enrolled?'Continue learning':'View pathway',state.enrolled?'05':'04')}</section><section class="card"><h2>Responsible AI in practice</h2><p>Check important claims. Use only information you are allowed to share. Keep responsibility for the final work.</p>${button('Start a practice activity','05',true)}</section><section class="card"><h2>Your learning record</h2><p class="stat">${state.credential?'1':'0'}</p><p>Competency credentials</p>${button('View achievement','08',true)}</section></div><div class="grid"><section class="card"><h2>Learning with others</h2><p>Your pilot cohort is discussing how to spot incorrect AI answers.</p>${button('Open community','09')}</section><section class="card"><h2>Your data, your choices</h2><p>Partner achievement sharing: <strong>${sharing()?'On':'Off'}</strong>.</p>${button('Review sharing','12',true)}</section></div>`,
'03':()=>heading('03','Find a useful pathway','Browse by your work, goals and available time.')+`<section class="card"><div class="form-row"><div><label for="search">Search learning</label><input id="search" type="search" placeholder="Try AI, records or communication"></div><div><label for="level">Level</label><select id="level"><option value="all">All levels</option><option value="Foundation">Foundation</option><option value="Applied">Applied</option></select></div></div><div id="catalog-results" class="grid"></div></section>`,
'04':()=>heading('04',esc(pathway(state.context)),'A practical pathway for your selected work context.')+`<div class="steps"><span>1 · Learn</span><span>2 · Practise</span><span>3 · Demonstrate</span><span>4 · Keep learning</span></div><div class="grid"><section class="card"><span class="tag">Applied</span><span class="tag">2–3 hours · illustrative</span><span class="tag">Facilitated cohort</span><h2>What you’ll be able to do</h2><ul><li>Choose an appropriate task for AI assistance</li><li>Produce a useful work artifact</li><li>Check factual claims and protect information</li><li>Explain when human expertise is needed</li></ul><h3>Before you begin</h3><p>Basic device skills. Synthetic examples are provided. Use only an approved tool.</p><h3>Assessment and credential</h3><p>A human assessor checks your final artifact and process evidence. Passing this example requires 70/100 overall and every critical criterion met.</p><p>Successful assessment leads to an Academy competency credential. External recognition is not established.</p></section><section class="card"><h2>Your enrollment</h2>${state.enrolled&&state.enrollmentContext!==state.context?`<div class="notice">The prototype already has one enrollment in ${esc(state.enrollmentContext)}. Open it to continue. Additional concurrent enrollments are a production requirement.</div>`:''}<p>English demonstration · pilot cohort</p><ul class="list"><li>Program version: 1.0</li><li>One guided practice and one practical assessment</li><li>Feedback, retry and appeal routes</li><li>No payment in R1</li></ul><div class="notice">Actual deadlines, retry allowances and appeal windows must be agreed and published before enrollment.</div><button id="enroll">${state.enrolled?'Open enrolled pathway':'Enroll in prototype'}</button><p class="label-note">Enrollment is simulated in browser storage.</p></section></div>`,
'05':()=>heading('05','Practice: check an AI-generated answer','Activity 1 · verification and information handling')+`<div class="grid"><section class="card"><h2>Task instructions</h2><p>Review this fictional AI summary for a ${esc((state.enrollmentContext||state.context)==='Agri Saha'?'farm record':(state.enrollmentContext||state.context)==='MSME'?'business record':(state.enrollmentContext||state.context)==='Government'?'administrative document':(state.enrollmentContext||state.context)==='Health Saha'?'role-appropriate health communication':'workplace record')}. Identify the unsupported claim and prepare a question for an expert.</p><div class="preview"><strong>Example AI draft</strong><p>“This approach always improves results by 40%, regardless of local conditions. No further checks are needed.”</p></div><h3>What would you check?</h3><ul><li>Where does the number come from?</li><li>Does the source apply to this situation?</li><li>What context is missing?</li><li>Is the decision consequential?</li></ul><div class="notice warning">Use synthetic information. Do not paste private records into external tools.</div></section><form id="practice" class="card"><h2>Your practice response</h2><label for="practice-check">What is unreliable, and what would you check?</label><textarea id="practice-check" required minlength="20">${esc(state.practice||'')}</textarea><label class="check"><input id="practice-safe" type="checkbox" ${state.activity?'checked':''}>I used synthetic information and identified the need for verification.</label><p id="practice-error" class="error" tabindex="-1" role="alert"></p><div class="actions"><button type="submit">Complete practice locally</button>${button('Open assessment','06',true)}</div><p class="label-note">Production completion rules are server checked. This prototype uses a simple local demonstration rule.</p>${state.activity?'<div class="notice success">Practice completed in this prototype.</div>':''}</form></div>`,
'06':()=>heading('06','Demonstrate your capability','Submit both the final work and the reasoning behind it.')+`${!state.enrolled||!state.activity?`<div class="notice warning">Complete enrollment and the required practice first. ${button('Open pathway','04',true)} ${button('Open practice','05',true)}</div>`:''}<div class="grid"><form id="assessment" class="card"><h2>Assessment evidence</h2>${[['task','Task and audience'],['draft','AI instructions and draft'],['checks','Checks, sources and errors identified'],['final','Final work and judgment']].map(([k,l])=>`<label for="e-${k}">${l}</label><textarea id="e-${k}" name="${k}" ${state.attempt!=='draft'?'readonly':''} maxlength="4000" required minlength="20">${esc(state.evidence[k]||'')}</textarea>`).join('')}<label class="check"><input id="declaration" type="checkbox" ${state.attempt!=='draft'?'checked disabled':''}>I confirm this evidence uses permitted information and explains my own judgment.</label><p id="assessment-error" class="error" tabindex="-1" role="alert"></p><div class="actions"><button type="button" id="save-draft" class="secondary" ${state.attempt!=='draft'?'disabled':''}>Save draft</button><button type="submit" ${state.attempt!=='draft'||!state.enrolled||!state.activity?'disabled':''}>Submit for human review</button></div><p id="draft-status" class="label-note">Status: ${esc(state.attempt)}</p></form><section class="card"><h2>How you are assessed</h2><ul class="list"><li>Task quality · 40 points</li><li>Verification · 25 points</li><li>Information handling · 20 points · critical</li><li>Judgment · 15 points · critical</li></ul><div class="notice">Reference threshold: 70/100, with all critical criteria met. A high total cannot override a critical failure.</div><p>Submission becomes read-only. Feedback and permitted retry/appeal routes follow human review.</p>${button('Open feedback','07',true)} ${button('Simulate assessor review','10',true)}</section></div>`,
'07':()=>heading('07','Feedback and next steps','Understand what you demonstrated and what to improve.')+`<div class="grid"><section class="card"><h2>${esc(status())}</h2>${state.decision?`<p>Overall score: <strong>${state.score}/100</strong></p><p>Critical criteria: <strong>${state.critical?'Met':'Not met'}</strong></p><div class="notice ${state.attempt==='passed'?'success':'warning'}">${esc(state.feedback||'Review the rubric and strengthen your verification evidence.')}</div>`:'<p>No final decision yet. Submit evidence, then use the assessor review screen to simulate review.</p>'}<div class="actions">${state.attempt==='passed'?button('View credential','08'):button('Open assessment','06',true)}${state.attempt==='failed'?'<button id="retry">Start a new attempt</button>':''}</div><p class="label-note">Production retries use the enrollment policy. This example permits a local retry.</p></section><form class="card" id="appeal"><h2>Ask for a decision review</h2><p>An independent reviewer considers your rationale. The original decision stays in history.</p><label for="appeal-text">Why should this decision be reviewed?</label><textarea id="appeal-text" minlength="20" maxlength="4000" ${!state.decision?'disabled':''}>${esc(state.appealText||'')}</textarea><p id="appeal-error" class="error" tabindex="-1" role="alert"></p><button type="submit" ${!state.decision||state.appeal?'disabled':''}>Open appeal locally</button>${state.appeal?`<div class="notice">Appeal status: ${esc(state.appeal)}. Resolution is not implemented in this prototype.</div>`:''}</form></div>`,
'08':()=>heading('08','Your credential','An achievement with a clear basis and current status.')+`${state.attempt!=='passed'&&!state.credential?`<section class="card"><h2>Not yet issued</h2><p>A competency credential becomes available after a passing decision. Course attendance alone does not establish competence.</p>${button('View assessment status','07')}</section>`:`<div class="grid"><section class="card"><div class="eyebrow">Illustrative Academy issuer</div><div class="preview"><h2>Competency credential</h2><p>Awarded to <strong>${esc(state.name)}</strong></p><p>${esc(pathway())}</p><span class="tag">${state.credential?'Issued in prototype':'Eligible · pending local issue'}</span></div><p>Originating context: ${esc(state.enrollmentContext||state.context)}</p><p>Basis: practical work and responsible AI judgment assessed against version 1.0.</p><p>No external accreditation is claimed. This is a fictional award.</p>${!state.credential?'<button id="issue">Issue local demonstration credential</button>':''}</section><section class="card"><h2>Verification visibility</h2><label class="check"><input id="public" type="checkbox" ${state.public?'checked':''} ${!state.credential?'disabled':''}>Enable a simulated public verification view</label><p>Private by default. Public view includes issuer, approved name, achievement and status only.</p><div id="verification-preview" class="notice">${state.public?`Public preview · ${esc(state.name)} · ${esc(pathway())} · Issued`:'Verification is private. No public record is available.'}</div><p class="label-note">No actual public URL, token, score disclosure or external verification service is created.</p></section></div>`}`,
'09':()=>heading('09','Learn with your cohort','Ask questions, share practice and get facilitator support.')+`<div class="grid"><section class="card"><h2>Verification in everyday work</h2><span class="tag">Private cohort</span><article><h3>Facilitator · Discussion prompt</h3><p>What did you check when an AI answer sounded confident but offered no evidence?</p><p class="label-note">Approved discussion prompt · peer replies are not official advice.</p></article><ul class="list">${state.posts.map((p,i)=>`<li><strong>${esc(state.name)} · peer contribution</strong><p>${esc(p)}</p><button class="secondary report" data-post="${i}">Report contribution</button></li>`).join('')||'<li>No learner replies yet. Start the discussion.</li>'}</ul></section><form class="card" id="community"><h2>Add a reply</h2><label for="reply">Your contribution</label><textarea id="reply" minlength="10" maxlength="5000" required placeholder="Share the checking process, without private details."></textarea><p id="community-error" class="error" tabindex="-1" role="alert"></p><button type="submit">Post locally</button><div class="notice">Only cohort members can access this space in the product design. Reports are reviewed by a scoped moderator.</div></form></div><section class="card" style="margin-top:18px"><h2>Report an issue</h2><label for="report-reason">Reason</label><select id="report-reason"><option>Misleading or unsafe advice</option><option>Harassment or inappropriate behavior</option><option>Private information</option><option>Spam</option></select><p class="label-note">Choose a reason, then use a contribution’s Report button. Reports in this prototype show a local acknowledgment only.</p></section>`,
'10':()=>heading('10','Assigned assessment review','Staff simulation · access must be enforced by assigned role in the real product.')+`<div class="notice">This review view deliberately exposes fictional evidence for design review. It is not an authorization implementation.</div><div class="grid"><section class="card"><h2>Assigned queue</h2><div class="table-wrap"><table><thead><tr><th>Learner</th><th>Attempt</th><th>Status</th></tr></thead><tbody><tr><td>${esc(state.name)}</td><td>Practical demonstration</td><td>${esc(state.attempt)}</td></tr></tbody></table></div><h3 style="margin-top:18px">Submission evidence</h3>${Object.entries(state.evidence).map(([k,v])=>`<details><summary>${esc(k)}</summary><p style="white-space:pre-wrap">${esc(v)}</p></details>`).join('')||'<p>No evidence submitted.</p>'}</section><form class="card" id="review"><h2>Finalize demonstration decision</h2><label for="score">Overall score (0–100)</label><input id="score" type="number" min="0" max="100" step="1" value="${state.score}" required><label class="check"><input id="critical" type="checkbox" ${state.critical?'checked':''}>Every critical information-handling and judgment criterion is met</label><label for="review-feedback">Actionable feedback</label><textarea id="review-feedback" minlength="20" maxlength="4000" required>${esc(state.feedback||'You checked the unsupported claim, protected information and explained when expert review is needed.')}</textarea><label class="check"><input id="conflict" type="checkbox">I am an assigned assessor with no conflict of interest (simulation)</label><p id="review-error" class="error" tabindex="-1" role="alert"></p><button type="submit" ${state.attempt!=='submitted'&&state.attempt!=='under_review'?'disabled':''}>Finalize locally</button><p class="label-note">Passing rule: score ≥70 AND all critical criteria met. Decisions are immutable in the product design.</p></form></div>`,
'11':()=>heading('11','Program administration',`Staff simulation · ${esc(state.context)} delivery workspace`)+`<div class="grid three"><section class="card"><h2>Enrollments</h2><p class="stat">${state.enrolled?'1':'0'}</p><p>Fictional cohort</p></section><section class="card"><h2>Assessed achievements</h2><p class="stat">${state.credential?'1':'0'}</p><p>Competency credentials issued</p></section><section class="card"><h2>Content health</h2><p class="stat">1</p><p>Published pathway · owner assigned</p></section></div><section class="card" style="margin-top:18px"><h2>Content and delivery controls</h2><div class="table-wrap"><table><thead><tr><th>Program</th><th>Version</th><th>State</th><th>Accountability</th></tr></thead><tbody><tr><td>${esc(pathway())}</td><td>1.0</td><td>Published · immutable</td><td>Illustrative content reviewer</td></tr><tr><td>Next revision</td><td>1.1</td><td>Draft</td><td>Assigned author</td></tr></tbody></table></div><div class="actions"><button id="request-review" class="secondary">Request draft review locally</button>${button('Review learner assessment','10',true)}${button('Integration controls','12',true)}</div><div class="notice">Published versions cannot be overwritten. Current enrollments retain version and policy snapshots.</div><h3>Reporting scope</h3><p>This view shows a fictional assigned organization. Sponsor reporting would show authorized completion/outcome measures; private submissions require separate assessor permission.</p></section>`,
'12':()=>heading('12','Connected ecosystem and sharing','Choose whether this ecosystem may receive your achievement status.')+`<div class="grid"><section class="card"><h2>${esc(state.context)} connection</h2><span class="tag">Illustrative partner</span><p>Connection supports entry to learning and permitted achievement exchange.</p><label class="check"><input id="sharing" type="checkbox" ${sharing()?'checked':''}>Allow this partner to receive my pathway completion and credential status for capability-development support</label><p class="label-note">This optional grant excludes scores, evidence and records from other tenants. Identity and required processing have separate rules.</p><div class="notice">${sharing()?'Sharing is on in this prototype.':'Sharing is off. New achievement deliveries would be blocked.'}</div><button id="delivery" class="secondary">Simulate achievement delivery</button><p id="delivery-status" role="status" style="margin-top:12px"></p></section><section class="card"><h2>Your data requests</h2><p>You can request your learning record or ask about an account-data action.</p><div class="actions"><button id="export" class="secondary">Export fictional local record</button><button id="support" class="secondary">Simulate support request</button></div><div class="notice warning">Withdrawal blocks future authorized delivery; it does not claim to recall data previously received by a partner. Retention rules require governance decisions.</div><details><summary>Integration design note</summary><p>At-least-once delivery, idempotency, signature checking and a current-permission check are specified for the real system. No webhook or network call runs here.</p></details></section></div>`,
'13':()=>heading('13','Find a mentor','R2 concept · professional discovery is opt-in.')+`<div class="notice">Future-release screen. No real people, contact details, fees or appointments are represented.</div><div class="grid"><section class="card"><span class="tag">Illustrative profile</span><h2>Dev · Productivity facilitator</h2><p>Scope: AI-supported communication and information verification.</p><p>Availability: one introductory conversation per week · illustrative</p><button id="mentor">${state.mentor?'Request sent locally':'Request an introduction locally'}</button><p class="label-note">Requests require mentor acceptance. Private contact details are not shared automatically.</p></section><section class="card"><h2>Your networking profile</h2><label class="check"><input id="discoverable" type="checkbox" ${state.discoverable?'checked':''}>Make my approved display profile discoverable in this ecosystem</label><p>Visible fields: display name and selected professional interests.</p><p>Phone, email, submissions and assessment scores stay private.</p></section></div>`,
'14':()=>heading('14','Keep building your capabilities','Updates, practice and useful next steps.')+`<div class="grid"><section class="card"><span class="tag">10-minute practice</span><h2>Checking fabricated references</h2><p>Learn to spot a source that sounds plausible but cannot be verified.</p><p class="label-note">Suggested because you selected responsible AI productivity. R2 recommendation logic is illustrative.</p><div class="actions">${button('Try verification practice','05')}<button id="save-update" class="secondary">${state.savedUpdate?'Saved locally':'Save for later'}</button></div></section><section class="card"><h2>Learning reminders</h2><label class="check"><input id="reminders" type="checkbox" ${state.reminders?'checked':''}>Receive optional learning reminders</label><p>Essential account and assessment notices are managed separately.</p><h3>Your credential</h3><p>${state.credential?'Current illustrative credential has no expiry configured.':'No credential issued yet.'}</p><p class="label-note">Opening an update does not renew a credential.</p></section></div>`
};
function renderCatalog(){const q=document.getElementById('search').value.trim().toLowerCase(),level=document.getElementById('level').value;const items=[{title:pathway(state.context),level:'Applied',tag:'Your current ecosystem'},{title:'Responsible AI foundations',level:'Foundation',tag:'Shared Academy'},{title:'Clear workplace communication',level:'Foundation',tag:'Shared Academy'}].filter(x=>(x.title.toLowerCase().includes(q)||x.tag.toLowerCase().includes(q))&&(level==='all'||x.level===level));document.getElementById('catalog-results').innerHTML=items.length?items.map(x=>`<article class="card"><span class="tag">${x.level}</span><h2>${esc(x.title)}</h2><p>${esc(x.tag)}</p>${button('View sample pathway','04')}</article>`).join(''):'<div class="notice">No matches. Try another term or clear the level filter.</div>';}
function readEvidence(){return Object.fromEntries(['task','draft','checks','final'].map(k=>[k,document.getElementById('e-'+k).value.trim()]));}
function render(){const match=location.hash.match(/^#WF-(\d{2})$/);const id=match&&views[match[1]]?match[1]:'02';document.title=`WF-${id} · Aplyd Academy`;document.getElementById('context').value=state.context;document.getElementById('nav').innerHTML=screens.map(([n,l])=>`<a href="#WF-${n}" ${n===id?'aria-current="page"':''}>${n}. ${l}</a>`).join('');main.innerHTML=views[id]()+`<div class="foot">Aplyd Academy · Design assumptions for review · <button id="reset" class="secondary">Reset local demonstration</button><p>These wireframes show layout, copy and flow. Identity, authorization, network synchronization, credential verification and backend rules are not implemented.</p></div>`;bind(id);main.focus({preventScroll:true});window.scrollTo(0,0);}
function bind(id){if(id==='03'){renderCatalog();document.getElementById('search').addEventListener('input',renderCatalog);document.getElementById('level').addEventListener('change',renderCatalog);}const on=(name,event,fn)=>{const el=document.getElementById(name);if(el)el.addEventListener(event,fn);};
on('onboarding','submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return error('onboarding-error','Enter a display name.');if(!document.getElementById('adult').checked)return error('onboarding-error','This pilot requires adult eligibility confirmation.');state.name=name;state.roles=document.getElementById('roles').value.trim();state.adult=true;state.onboarded=true;persist();go('02');notify('Profile saved locally.');});
on('enroll','click',()=>{if(!state.enrolled)state.enrollmentContext=state.context;state.enrolled=true;persist();go('05');notify('Enrolled in the local sample pathway.');});
on('practice','submit',e=>{e.preventDefault();if(!state.enrolled)return error('practice-error','Enroll in the pathway before completing practice.');const text=document.getElementById('practice-check').value.trim();if(text.length<20||!document.getElementById('practice-safe').checked)return error('practice-error','Add a checking process of at least 20 characters and confirm safe practice.');state.practice=text;state.activity=true;persist();go('06');notify('Practice completion recorded locally.');});
on('save-draft','click',()=>{state.evidence=readEvidence();persist();document.getElementById('draft-status').textContent='Draft saved locally at '+new Date().toLocaleTimeString();notify('Draft saved in this browser.');});
on('assessment','submit',e=>{e.preventDefault();if(state.attempt!=='draft'||!state.activity||!state.enrolled)return error('assessment-error','This attempt cannot be submitted in its current state.');const evidence=readEvidence();if(Object.values(evidence).some(x=>x.length<20))return error('assessment-error','Every evidence field needs at least 20 characters.');if(!document.getElementById('declaration').checked)return error('assessment-error','Confirm the submission declaration.');state.evidence=evidence;state.attempt='submitted';persist();go('07');notify('Submitted locally. Use Assessor queue to simulate human review.');});
on('review','submit',e=>{e.preventDefault();const score=Number(document.getElementById('score').value),feedback=document.getElementById('review-feedback').value.trim();if(!['submitted','under_review'].includes(state.attempt))return error('review-error','Only a submitted attempt can be reviewed.');if(!document.getElementById('conflict').checked)return error('review-error','Confirm assignment and absence of conflict for the demonstration.');if(!Number.isInteger(score)||score<0||score>100||feedback.length<20)return error('review-error','Enter a whole score between 0 and 100 and useful feedback.');state.score=score;state.critical=document.getElementById('critical').checked;state.feedback=feedback;state.attempt=score>=70&&state.critical?'passed':'failed';state.decision=state.attempt;persist();go('07');notify('Local decision finalized: '+state.attempt+'.');});
on('retry','click',()=>{state.attempt='draft';state.decision='';state.appeal='';state.credential=false;state.public=false;persist();go('06');notify('New local attempt opened. The production system retains historical attempts.');});
on('appeal','submit',e=>{e.preventDefault();const text=document.getElementById('appeal-text').value.trim();if(!state.decision||state.appeal||text.length<20)return error('appeal-error','A finalized decision and rationale of at least 20 characters are required.');state.appealText=text;state.appeal='opened';persist();render();notify('Appeal recorded locally. Independent review remains a specification.');});
on('issue','click',()=>{if(state.attempt!=='passed')return;state.credential=true;persist();render();notify('One fictional credential issued locally.');});
on('public','change',e=>{state.public=e.target.checked;persist();render();notify(state.public?'Public preview enabled locally.':'Public preview withdrawn locally.');});
on('community','submit',e=>{e.preventDefault();const reply=document.getElementById('reply').value.trim();if(reply.length<10)return error('community-error','Write at least 10 characters.');state.posts.push(reply);persist();render();notify('Reply posted in the local simulation.');});
on('request-review','click',()=>notify('Draft review requested locally. No publication or staff assignment occurred.'));
on('sharing','change',e=>{state.shareByContext={...(state.shareByContext||{}),[state.context]:e.target.checked};persist();render();notify(sharing()?'Sharing grant enabled locally.':'Sharing grant withdrawn locally.');});
on('delivery','click',()=>{document.getElementById('delivery-status').textContent=!sharing()?'Blocked: no active sharing grant.':!state.credential?'Nothing to send: no issued achievement.':state.enrollmentContext!==state.context?'Blocked: achievement belongs to a different context in this demonstration.':'Simulated delivery allowed: credential status only. No network call occurred.';});
on('export','click',()=>{const payload={fictional_demo:true,name:state.name,context:state.enrollmentContext||state.context,enrolled:state.enrolled,activity_completed:state.activity,attempt_status:state.attempt,credential:state.credential};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='aplyd-fictional-learning-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Fictional local record downloaded.');});
on('support','click',()=>notify('Support request acknowledged locally. No support ticket was transmitted.'));
on('mentor','click',()=>{state.mentor=true;persist();render();notify('Introduction request recorded locally. No person was contacted.');});
on('discoverable','change',e=>{state.discoverable=e.target.checked;persist();notify('Local networking preference updated.');});
on('save-update','click',()=>{state.savedUpdate=!state.savedUpdate;persist();render();});
on('reminders','change',e=>{state.reminders=e.target.checked;persist();notify('Local reminder preference updated. No notifications scheduled.');});
on('reset','click',()=>{if(!confirm('Reset fictional data stored by this prototype?'))return;state={...defaults,evidence:{},posts:[]};persist();go('01');notify('Local demonstration reset.');});}
document.addEventListener('click',e=>{const goButton=e.target.closest('[data-go]');if(goButton)go(goButton.dataset.go);const report=e.target.closest('.report');if(report)notify('Report acknowledged locally: '+document.getElementById('report-reason').value+'. No moderation service was contacted.');});
document.getElementById('context').addEventListener('change',e=>{state.context=e.target.value;persist();render();notify('Context changed. This simulation uses one sample pathway; production records remain tenant scoped.');});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
