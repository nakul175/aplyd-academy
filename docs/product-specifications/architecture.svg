<g font-size="14" text-anchor="middle"><text x="220" y="289">Identity and context</text><text x="515" y="289">Content and learning</text><text x="800" y="289">Assessment and credentials</text><text x="220" y="323">Community and moderation</text><text x="515" y="323">Privacy and reporting</text><text x="800" y="323">Integration and audit</text></g>
<g stroke="#677487" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M220 364 V405"/><path d="M515 364 V405"/><path d="M800 364 V405"/></g>
