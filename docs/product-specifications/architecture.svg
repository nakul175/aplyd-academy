<g text-anchor="middle"><text x="220" y="433" font-size="16">Relational transaction store</text><text x="220" y="455" font-size="13">Records, decisions and outbox</text><text x="220" y="476" font-size="13">Tenant consistent constraints</text><text x="515" y="433" font-size="16">Private file store</text><text x="515" y="455" font-size="13">Content and safe evidence</text><text x="515" y="476" font-size="13">Authorized short lived access</text><text x="815" y="433" font-size="16">Asynchronous worker</text><text x="815" y="455" font-size="13">Retries, exports and notifications</text><text x="815" y="476" font-size="13">Signed permission checked delivery</text></g>
<text x="30" y="535" font-size="13" fill="#58677a">Proposed pilot design  •  No cloud or framework selected  •  AI practice uses approved external tools</text></g></svg>
