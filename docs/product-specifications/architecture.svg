<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Aplyd Academy proposed architecture</title><desc id="desc">Learners and operators access the responsive web client and backend. Partner and identity adapters connect at distinct trust boundaries. Backend modules use a relational database, private file storage, and an outbox worker for signed permissioned delivery.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#677487"/></marker></defs>
<rect width="1040" height="560" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#17253a"><text x="30" y="32" font-size="22" font-weight="bold">Shared platform with scoped partner access</text>
<g fill="#f3f6fa" stroke="#aab7c8"><rect x="30" y="65" width="290" height="58" rx="6"/><rect x="365" y="65" width="300" height="58" rx="6"/><rect x="710" y="65" width="290" height="58" rx="6"/></g>
<g font-size="16" text-anchor="middle"><text x="175" y="90">Learners and operators</text><text x="175" y="111" font-size="13">Responsive Academy experience</text><text x="515" y="90">Approved identity provider</text><text x="515" y="111" font-size="13">Authentication and issuer subject</text><text x="855" y="90">Partner ecosystem</text><text x="855" y="111" font-size="13">Launch and scoped service client</text></g>
<g stroke="#677487" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M175 123 V175 H280 V202"/><path d="M515 123 V202"/><path d="M855 123 V175 H750 V202"/></g>
<rect x="85" y="202" width="870" height="162" rx="8" fill="#eaf1f9" stroke="#7086a2"/>
