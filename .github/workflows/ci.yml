name: verify

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable the pinned pnpm (packageManager in package.json)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint (ratchet against .lint-baseline.json)
        run: pnpm run lint:baseline
      - name: Documentation index is current
        run: pnpm run docs:index:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
