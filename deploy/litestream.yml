# Continuous SQLite backup to DigitalOcean Spaces, Bangalore (ACA-US-1.3). Credentials come from
# /etc/academy/litestream.env (LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY), never this file.
dbs:
  - path: /var/lib/academy/academy.sqlite
    replicas:
      - type: s3
        bucket: aplyd-academy-backups
        path: academy
        endpoint: https://blr1.digitaloceanspaces.com
        region: blr1
        retention: 720h          # 30 days of point-in-time restore
        snapshot-interval: 24h
        sync-interval: 10s       # at most about 10 seconds of writes lost if the droplet dies
